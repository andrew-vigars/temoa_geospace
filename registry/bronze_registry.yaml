datasets:
  - id: commodities
    path: registry/commodities.csv
    schema: commodities
    description: "Commodity list CSV (raw)"

  - id: demand
    path: data_files/demand.csv
    schema: demand
    description: "Annual gasoline demand in t/year, converted from litres at 0.00074 t/L"

  - id: sites
    path: data_files/sites.csv
    schema: sites
    description: "Site definitions (raw)"

  - id: generation_efficiency
    path: registry/generation_efficiency.csv
    schema: generation_efficiency
    description: "Generator efficiency table (raw)"

  - id: techs
    path: registry/techs.csv
    schema: techs
    description: "Technology definitions (raw)"

  - id: transport_techs
    path: registry/transport_techs.csv
    schema: transport_techs
    description: "Transport technology data (raw)"
