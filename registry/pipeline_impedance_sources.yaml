schema_version: 2
status: research_only_not_consumed
purpose: >-
  Document the national source datasets that may support a future pipeline
  routing-impedance or siting layer. This file does not configure the current
  Bronze, Silver, or Gold workflow and intentionally contains no scalar penalty
  weights. Canonical acquisition metadata belongs in geospatial_sources.yaml.

canonical_source_registry: registry/geospatial_sources.yaml

current_national_sources:
  - role: hydrography
    source_id: nrcan_nhn_hhyd_national_en
    intended_evidence: >-
      National waterbody and watercourse geometry for a future routing penalty
      or exclusion layer.
    workflow_status: silver_filtering_available_impedance_not_implemented
    replaces_legacy_reference: ontario_ohn_waterbody

  - role: aboriginal_lands
    source_id: nrcan_aboriginal_lands_national_en
    intended_evidence: >-
      National Aboriginal Lands legislative boundaries for future siting or
      routing treatment subject to documented modelling and consultation rules.
    workflow_status: bronze_available_impedance_not_implemented
    replaces_legacy_reference: ontario_first_nation_reserve

  - role: population_exposure
    source_id: statcan_2021_da_population_density_inputs
    intended_evidence: >-
      National dissemination-area population and land-area data from which a
      transparent population-density or exposure layer may be derived.
    workflow_status: bronze_available_impedance_not_implemented
    replaces_legacy_reference: statcan_2021_ontario_da_population_density

implementation_notes:
  - >-
    National datasets are acquired once and clipped or filtered to the study
    area during Silver processing; province-specific source registrations are
    not required.
  - >-
    The existing NHN Silver stage filters national hydrography but does not yet
    translate it into pipeline impedance weights.
  - >-
    Aboriginal Lands and dissemination-area population inputs are preserved in
    Bronze but are not currently encoded as pipeline penalties or exclusions.
  - >-
    Any future impedance implementation must define auditable transformations,
    units, weights, combination rules, and treatment of missing evidence before
    these sources affect routing.

historical_reference_lineage:
  status: inactive_reference_model_evidence
  reference_model: Hydrogen_Project_Final
  note: >-
    These fingerprints identify copied Ontario-only layers used to investigate
    the legacy reference model. They are retained for provenance only and are
    neither acquisition targets nor active pipeline inputs.
  sources:
