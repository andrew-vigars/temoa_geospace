# Global non-spatial model defaults shared by every GeoCANOE Gold build.
# A selected registry/scenarios/*.toml file may override recognized settings
# below without changing the Silver evidence layers.

[time]

# One optimization period spanning [2025, 2050), with 2050 retained only as
# the terminal boundary required by Temoa to calculate a 25-year period length.
start_year = 2025
end_year = 2050

[finance]

# Social discount rate used to calculate the present value of annual costs.
global_discount_rate = 0.03

# Default financing rate used when annualizing technology investment costs.
default_loan_rate = 0.03

[emissions]

# Supported projection methods:
#   "constant" - hold the observed annual facility-emissions baseline constant
#                in every model-period year. Because Temoa optimizes one
#                representative year, Gold encodes the annual baseline unchanged
#                as LimitCapacity in t CO2e/year. Multiply solved annual activity
#                by (end_year - start_year) only for cumulative reporting.
# No other projection methods are currently supported.
# Silver always remains in kt CO2e/year; Gold converts kt to tonnes but does not
# multiply the capacity limit by the model-period duration.
projection_method = "constant"

[storage]

# Supported storage requirements:
#   "none"                        - geological storage remains optional;
#   "minimum_cumulative_activity" - require at least the configured total CO2
#                                   injection over the whole model period.
requirement = "minimum_cumulative_activity"

# Tonnes CO2e over the complete [start_year, end_year) model period.
# Gold converts this cumulative target to Temoa's annual LimitActivity value by
# dividing it by (end_year - start_year). This must be positive for
# "minimum_cumulative_activity" and exactly zero for "none".
minimum_cumulative_activity = 6_800_000_000

[basemap]

# Silver basemap grid family to build Gold from: "geographic" (EPSG:4326,
# decimal degrees) or "projected" (EPSG:3347, kilometres).
grid_type = "projected"

# Resolution in the selected grid family's native unit. Schema construction
# selects the Silver basemap generated by the active build profile that
# exactly matches this grid_type and resolution. If no such basemap was
# generated, construction fails with a ValueError listing what is available
# instead of falling back to an interactive prompt.
resolution = 20
