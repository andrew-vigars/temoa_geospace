# Baseline stress test with three H2-derived EOS curves available to CO2
# pipelines. Truck transport remains enabled to measure substitution as the
# pipeline capacity ceiling increases.

[scenario]
id = "baseline-co2-3x"
description = "Baseline CO2 network with three EOS pipeline curves and trucks"

[storage]
requirement = "none"
minimum_cumulative_activity = 0

[transport_modes]
roads_enabled = true
pipelines_enabled = true

[pipeline_costs]
impedance_scope = "all_km_dependent"

[pipeline_costs.eos_stack_counts]
CO2_PIPE = 3
GSL_PIPE = 1
H2_PIPE = 1
METOH_PIPE = 1
