[scenario]
id = "emissions-price"
description = "Facility-origin emissions price; fallback gasoline reported but unpriced"

[emissions]
policy = "emissions_price"
# Explicit price-driven alternative to a storage target: choose a positive
# price for the study, in the same currency as all other model costs.
# This value is illustrative, not a default or recommendation. High prices or
# storage targets near 100% can result in long model solve times.
price_per_tonne = 100
fallback_gasoline_emission_factor = 0

[storage]
requirement = "none"
minimum_cumulative_activity = 0
point_source_fraction = 0

[transport_modes]
roads_enabled = true
pipelines_enabled = true
disabled_technologies = []

[pipeline_costs]
impedance_scope = "all_km_dependent"

[pipeline_costs.eos_stack_counts]
# Five complete EOS curves expand corridor capacity without a pipe-count integer.
CO2_PIPE = 5
GSL_PIPE = 1
H2_PIPE = 1
METOH_PIPE = 1
