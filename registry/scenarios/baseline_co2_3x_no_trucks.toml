# Baseline pipeline-only feasibility test with three H2-derived EOS curves
# available to CO2 pipelines. Disabling roads removes every truck technology
# from Gold while geological storage remains optional.

[scenario]
id = "base-co2-3x-no-truck"
description = "Baseline CO2 network with three EOS curves and no trucks"

[storage]
requirement = "none"
minimum_cumulative_activity = 0

[transport_modes]
roads_enabled = false
pipelines_enabled = true

[pipeline_costs]
impedance_scope = "all_km_dependent"

[pipeline_costs.eos_stack_counts]
CO2_PIPE = 3
GSL_PIPE = 1
H2_PIPE = 1
METOH_PIPE = 1
