# =============================================================================
# GeoCANOE Gold-model scenario — NET-ZERO CO2 TARGET
# =============================================================================
#
# Define a positive carbon storage target OR a positive atmospheric emissions
# price for a net-zero/carbon-policy scenario. Neither has a default value.
# This current one-curve comparison arbitrarily selects 75% point-source
# storage, with trucks and pipelines enabled. Select a value for each study;
# 75% is a run-specific choice, not a default or recommendation.
# High carbon prices or storage targets near 100% can result in long solve times.
#
# registry/scenarios/*.toml (other than this file) are local, policy-specific
# and are gitignored: they are not committed. To create your own scenario,
# copy this file, assign a unique scenario ID, and uncomment only the
# settings that should differ.
#
# Scenario files are overlays on registry/model.toml:
#
#   1. registry/model.toml supplies the global defaults;
#   2. this file replaces only the settings explicitly declared below;
#   3. the merged configuration is validated and encoded into Gold;
#   4. Silver evidence layers are never modified or rebuilt by a scenario.
#
# Supported override sections are [time], [finance], [emissions], [storage],
# [legacy_gasoline], [basemap], and [pipeline_costs]. Unknown sections,
# unknown keys, invalid values, and
# inconsistent combinations fail validation before schema construction.

[scenario]

# Required artifact identity. Use 1-20 lowercase letters, numbers, or hyphens.
# It must start and end with a letter or number. The ID appears in the compact
# Gold filename: gold_<build-id>_<scenario-id>_<fingerprint>.sqlite
id = "net-zero-25km"

# Optional human-readable explanation recorded in the resolved scenario.
# Changing only this description does not change model behaviour.
description = "Store 75% of modeled point-source CO2 with one EOS pipeline curve and trucks"


# -----------------------------------------------------------------------------
# Optional time-horizon overrides
# -----------------------------------------------------------------------------
#
# Uncomment both settings to replace the global single-period horizon.
# Years are integer boundaries defining [start_year, end_year), so 2025 and 2050
# represent 25 model years. end_year must be greater than start_year.
#
# Period length affects:
#   - cumulative reporting derived from annual representative-year activity; and
#   - conversion of cumulative storage targets to annual Temoa LimitActivity.
#
# [time]
# start_year = 2025
# end_year = 2050


# -----------------------------------------------------------------------------
# Optional financial overrides
# -----------------------------------------------------------------------------
#
# Rates are decimal fractions satisfying 0 <= rate < 1.
#
# global_discount_rate:
#   Social discount rate used by Temoa to convert annual costs to present value.
#   Physical emissions and storage quantities are not discounted.
#
# default_loan_rate:
#   Default financing rate used when annualizing technology investment costs.
#
# [finance]
# global_discount_rate = 0.03
# default_loan_rate = 0.03


# -----------------------------------------------------------------------------
# Optional emissions-projection override
# -----------------------------------------------------------------------------
#
# projection_method controls how the observed annual Silver facility-emissions
# baseline is represented as Gold annual availability.
#
# Currently supported value:
#   "constant" - encode annual emissions unchanged as representative-year
#                LimitCapacity. Temoa assumes that annual value in every model
#                year; the period length is not applied to LimitCapacity.
#
# Example: 1 kt CO2e/year becomes 1,000 t CO2e/year in Gold. Its conceptual
# 25-year cumulative availability is 25,000 t CO2e, but that cumulative value is
# for reporting and must not be encoded as annual LimitCapacity.
# No other projection methods are currently implemented.
#
# Target-driven option selected for this run. For a price-driven alternative,
# set policy = "emissions_price", choose a positive price_per_tonne in the
# model's cost currency/t CO2e, and set the storage requirement and both target
# fields below to "none", 0, and 0 respectively. Rebuild Gold after changing.
[emissions]
projection_method = "constant"
policy = "none"
price_per_tonne = 0


# -----------------------------------------------------------------------------
# Explicit geological-storage policy choice
# -----------------------------------------------------------------------------
#
# The target is resolved from the regional CO2 baseline actually encoded in
# Gold, after study-area filtering, dropping invalid/nonpositive facility rows,
# and graph snapping/outlier exclusion. It does not include prospective DAC.
# Annual required injection = point_source_fraction * included annual emissions.
# Cumulative target = annual requirement * model duration.
# A percentage target avoids exceeding the point-source supply solely because
# a fixed tonnage was chosen for a larger geography. Other network, fuel, and
# geological constraints can still limit feasibility. The scenario name is
# retained for compatibility; 75% storage is not a claim of full net zero.
#
# Absolute targets remain available for explicitly constructed cases (including
# future DAC supply) using requirement = "minimum_cumulative_activity" and a
# positive minimum_cumulative_activity, with point_source_fraction = 0.
# For no minimum: requirement = "none" and both numeric fields = 0.
#
[storage]
requirement = "minimum_point_source_fraction"
point_source_fraction = 0.75  # Arbitrary choice for the current comparison only.
minimum_cumulative_activity = 0


# -----------------------------------------------------------------------------
# Optional basemap-resolution override
# -----------------------------------------------------------------------------
#
# grid_type: "geographic" (EPSG:4326, decimal degrees) or "projected"
# (EPSG:3347, kilometres).
# resolution: value in that grid family's native unit.
#
# Schema construction selects the Silver basemap generated by the active
# build profile that exactly matches grid_type and resolution. Build profiles
# may generate several resolutions; if the requested one was not generated,
# construction fails with a ValueError listing what is actually available.
#
# [basemap]
# grid_type = "projected"
# resolution = 25


# -----------------------------------------------------------------------------
# Optional transport-representation switches
# -----------------------------------------------------------------------------
#
# These switches affect only Gold schema construction. Existing Silver road and
# pipeline-impedance products remain available for later scenarios. Electricity
# transmission continues to use the graph-edge topology independently.
#
[transport_modes]
roads_enabled = true
pipelines_enabled = true
disabled_technologies = []


# -----------------------------------------------------------------------------
# Optional pipeline geographic-cost bias override
# -----------------------------------------------------------------------------
#
# The selected Silver edge product supplies a cost-distance multiplier for each
# directed Ri-Rj edge. Physical graph distance is never overwritten.
#
# Supported scopes:
#   "none"             - physical distance for all pipeline costs;
#   "etl_capex_only"   - weighted distance for ETLSegment CAPEX only;
#   "all_km_dependent" - weighted distance for ETLSegment CAPEX, fixed OPEX,
#                        and variable OPEX.
#
[pipeline_costs]
impedance_scope = "all_km_dependent"

[pipeline_costs.eos_stack_counts]
CO2_PIPE = 1
GSL_PIPE = 1
H2_PIPE = 1
METOH_PIPE = 1
