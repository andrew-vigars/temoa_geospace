# Net-zero stress test with two H2-derived EOS curves available to CO2
# pipelines. Truck transport remains enabled for comparison with the canonical
# one-curve net-zero scenario.

[scenario]
id = "net-zero-co2-2x"
description = "Net-zero CO2 network with two EOS pipeline curves and trucks"

[storage]
requirement = "minimum_cumulative_activity"
minimum_cumulative_activity = 6_800_000_000

[transport_modes]
roads_enabled = true
pipelines_enabled = true

[pipeline_costs]
impedance_scope = "all_km_dependent"

[pipeline_costs.eos_stack_counts]
CO2_PIPE = 2
GSL_PIPE = 1
H2_PIPE = 1
METOH_PIPE = 1
