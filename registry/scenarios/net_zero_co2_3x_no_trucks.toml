# Net-zero pipeline-only feasibility test with three H2-derived EOS curves
# available to CO2 pipelines. Disabling roads removes every truck technology
# from Gold while leaving the pipeline candidate graph enabled.

[scenario]
id = "nz-co2-3x-no-truck"
description = "Net-zero CO2 network with three EOS curves and no trucks"

[storage]
requirement = "minimum_cumulative_activity"
minimum_cumulative_activity = 6_800_000_000

[transport_modes]
roads_enabled = false
pipelines_enabled = true

[pipeline_costs]
impedance_scope = "all_km_dependent"

[pipeline_costs.eos_stack_counts]
CO2_PIPE = 3
GSL_PIPE = 1
H2_PIPE = 1
METOH_PIPE = 1
