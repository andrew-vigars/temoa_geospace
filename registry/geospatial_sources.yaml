schema_version: 2

sources:
  - id: nrcan_land_cover_2020
    kind: raster_dataset
    domain: land_cover
    publisher: Natural Resources Canada, CCRS/CCMEO
    creator: Dr. Rasim Latifovic
    title: 2020 Land Cover of Canada
    licence: Open Government Licence - Canada
    record_id: ee1580ab-a23d-4f86-a09b-79763677eb47
    record_released: '2022-08-11'
    record_modified: '2025-09-23'
    catalogue_url: https://open.canada.ca/data/en/dataset/ee1580ab-a23d-4f86-a09b-79763677eb47
