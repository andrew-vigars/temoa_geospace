      stage: land_cover
      module: geocanoe.acquisition.land_cover
      refresh_policy: manual_new_snapshot_directory
      release_model: fixed_2020_observations_mutable_distribution
    bronze:
      root: data_files/raw/geography/land_cover/2020
      primary_artifact: classification
      artifacts:
        classification:
          path: landcover-2020-classification.tif
          format: geotiff
        metadata:
          path: catalogue.json
          format: json
        acquisition_manifest:
          path: acquisition_manifest.json
          format: json
