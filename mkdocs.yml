site_name: GeoCANOE documentation
site_url: https://andrew-vigars.github.io/temoa_geospace/
repo_url: https://github.com/andrew-vigars/temoa_geospace
repo_name: andrew-vigars/temoa_geospace
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - assets/javascripts/mermaid.min.js
  - assets/javascripts/mermaid-init.js
  - assets/javascripts/mermaid-panzoom.js

extra_css:
  - assets/stylesheets/mermaid-panzoom.css

exclude_docs: |
  tools/
  mkdocs.example.yml

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - Installation and setup: get-started.md
  - Concepts:
      - What is GeoCANOE?: what-is-geocanoe/overview.md
      - GeoCANOE, CANOE and Temoa: what-is-geocanoe/canoe-and-temoa.md
      - Model architecture: what-is-geocanoe/model-architecture.md
      - Glossary: what-is-geocanoe/glossary.md
  - Data Guide:
