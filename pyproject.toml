[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geocanoe"
version = "0.7.0"
description = "Reproducible geospatial data, model-building, and execution workflows for CANOE/TEMOA"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt", "temoa/requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = [
    "requirements.txt",
    "requirements-dev.txt",
    "temoa/requirements-dev.txt",
]}

[tool.setuptools.packages.find]
where = ["src"]
