[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geocanoe"
version = "0.7.0"
description = "Reproducible geospatial data, model-building, and execution workflows for CANOE/TEMOA"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
geocanoe-build-bronze = "geocanoe.execution.bronze:main"
geocanoe-build-silver = "geocanoe.execution.silver:main"
geocanoe-build-schema = "geocanoe.schema.build:main"
geocanoe-run = "geocanoe.execution.run:main"
geocanoe-batch = "geocanoe.execution.batch:main"
geocanoe-diagnostics = "geocanoe.diagnostics.cli:main"
geocanoe-export = "geocanoe.analysis.exports:main"
geocanoe-map = "geocanoe.analysis.maps:main"
geocanoe-network = "geocanoe.analysis.network:main"
geocanoe-network-plot = "geocanoe.analysis.network_viz:main"
geocanoe-network-html = "geocanoe.analysis.network_html:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt", "temoa/requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = [
    "requirements.txt",
    "requirements-dev.txt",
    "temoa/requirements-dev.txt",
]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src/geocanoe", "scripts", "diagnostics"]
mypy_path = "src"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "branca.*",
    "contextily.*",
    "folium.*",
    "geopandas.*",
    "geopy.*",
    "matplotlib.*",
    "openpyxl.*",
    "pandas.*",
    "pyogrio.*",
    "rasterio.*",
    "requests.*",
    "seaborn.*",
    "shapely.*",
    "tqdm.*",
    "xyzservices.*",
    "yaml.*",
]
ignore_missing_imports = true
