# GeoCANOE adapter settings, not the legacy canoe-fuel README template.
repo_dir = "../canoe-fuel"
expected_commit = "89a07cfd3925ed20f82a7d804a142af6ce82e183"
expected_config_sha256 = "2fd2770df240544ec0f380526752316a021412ab0ef63067050fc78a83b55101"
upstream_config = "input/params.toml"
bronze_config = "config/canoe_fuel/bronze.toml"
output_dir = "data_files/processed/gasoline_demand/fuel_supply/upstream_reference"

# Explicit single representative period. Do not let upstream's one-period
# default step of five years select 2030 for our 25-year period.
period_start = 2025
period_end = 2050
price_year = 2050
price_selection = "period_end"

# Preserve upstream results for review; Gold consumption is intentionally separate.
output_status = "review_required"

