# =============================================================================
# Geospatial-CANOE batch-run configuration
# =============================================================================

[batch]
name = "weekend_resolution_sweep"
continue_on_failure = true
skip_completed = true
retry_failed = false

[[runs]]
config = "temoa/data_files/my_configs/on-qc_25km_centroid_strong.toml"
enabled = true

[[runs]]
config = "temoa/data_files/my_configs/on-qc_0.25deg_centroid_strong.toml"
enabled = true

[[runs]]
config = "temoa/data_files/my_configs/provinces_only_basemap_50km_centroid_strong.toml"
enabled = true

[[runs]]
config = "temoa/data_files/my_configs/provinces_only_basemap_0.5deg_centroid_strong.toml"
enabled = true

[[runs]]
config = "temoa/data_files/my_configs/on-qc_10km_centroid_strong.toml"
enabled = true

[[runs]]
config = "temoa/data_files/my_configs/on-qc_0.10deg_centroid_strong.toml"
enabled = true

[[runs]]
config = "temoa/data_files/my_configs/provinces_only_basemap_25km_centroid_strong.toml"
enabled = true

[[runs]]
config = "temoa/data_files/my_configs/provinces_only_basemap_0.25deg_centroid_strong.toml"
enabled = true