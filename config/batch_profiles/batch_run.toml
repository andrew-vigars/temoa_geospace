# =============================================================================
# Geospatial-CANOE batch-run configuration
# =============================================================================
#
# A batch runs an ordered list of independent TEMOA solver configurations
# (see geocanoe.execution.batch). Each [[runs]] entry points at a solver
# config TOML like temoa/data_files/my_configs/*.toml; that file in turn names
# the scenario and the input/output SQLite database it runs against.
#
# The entry below is a committed, always-resolvable sample: it points at
# temoa/data_files/my_configs/config_sample.toml, which is kept in the repo
# for exactly this purpose. It is disabled by default so this file can be run
# as-is without executing a solve. Copy this block, point "config" at your own
# solver TOML (e.g. one generated for a build profile + scenario pair), and
# set enabled = true to add a real run to the batch.

[batch]
name = "provinces_sweep"
continue_on_failure = true
skip_completed = true
retry_failed = false

# =============================================================================
# Sample run (disabled) — replace with real solver configs before executing
# =============================================================================

[[runs]]
config = "temoa/data_files/my_configs/provinces_25km_baseline.toml"
enabled = true

[[runs]]
config = "temoa/data_files/my_configs/provinces_25km_net_zero.toml"
enabled = true

