# =============================================================================
# Geospatial-CANOE preprocessing build profile — COMMITTED SAMPLE
# =============================================================================
#
# This file is the committed, always-resolvable sample build profile. It is a
# copy of the provinces_only build profile, kept here under a stable
# "sample_*" name so it is never overwritten by edits to the real,
# study-area-specific profiles.
#
# config/build_profiles/*.toml (other than this file) are local, study-area
# and system-boundary specific and are gitignored: they are not committed.
# To create your own build profile, copy this file, choose a distinct
# [profile].id, and adjust the study-area, basemap, road, and schema settings
# to match your study.
#
# This file is intended to be read by project_config.py and shared across:
#
#   build_basemaps.py
#   build_region_adjacency.py
#   build_roads.py
#   map_roads.py
#   build_schema.py
#
# This is separate from the TEMOA solver configuration used by main_run.py.
# =============================================================================

[profile]
id = "provinces"


# -----------------------------------------------------------------------------
# Shared study area
# -----------------------------------------------------------------------------

[study_area]

# Filename-safe label propagated into processed outputs.
label = "provinces_only"

# Provinces and territories included in this build profile.
provinces = [
    "NL",
    "PE",
    "NS",
    "NB",
    "QC",
    "ON",
    "MB",
    "SK",
    "AB",
    "BC",
    # "YT",
    # "NT",
    # "NU",
]


# -----------------------------------------------------------------------------
# Basemap generation
# -----------------------------------------------------------------------------

[basemaps]

# Current workflow supports centroid retention.
keep_method = "centroid"

# Decimal precision used for exported coordinates and grid lookup.
coordinate_precision = 6


[basemaps.geographic]

# EPSG:4326 grid resolutions in decimal degrees.
# Leave empty to skip geographic basemap generation.
resolutions = []


[basemaps.projected]

# EPSG:3347 grid resolutions in kilometres.
# Leave empty to skip projected basemap generation.
resolutions_km = [25, 50]


# -----------------------------------------------------------------------------
# Region adjacency
# -----------------------------------------------------------------------------

[adjacency]

# Current workflow supports four-direction rook adjacency.
method = "rook"

# Precision used for native-coordinate neighbour lookup.
coordinate_precision = 6

# Sentinel used when a region has no neighbour in one direction.
no_neighbor_id = "R-999"


# -----------------------------------------------------------------------------
# Processed road networks
# -----------------------------------------------------------------------------

[roads]

# Nested processed road-network layers to build.
networks = [
    "backbone",
    "primary_freight",
    "freight_access",
]

# Set true to also export one filtered GeoPackage per selected jurisdiction.
export_individual_provinces = false

# Output CRS for merged processed road networks.
output_crs = "EPSG:4326"


[roads.classes]

# Highest-order intercity corridors.
backbone = [
    "Freeway",
    "Expressway / Highway",
    "Ramp",
]

# Major freight-capable road network.
primary_freight = [
    "Freeway",
    "Expressway / Highway",
    "Ramp",
    "Arterial",
]

# Full road-access network used for rural and resource accessibility.
freight_access = [
    "Freeway",
    "Expressway / Highway",
    "Ramp",
    "Arterial",
    "Collector",
    "Local / Street",
    "Local / Unknown",
]


# -----------------------------------------------------------------------------
# Road-to-graph connectivity
# -----------------------------------------------------------------------------

[road_connectivity]

# Processed road layer used for graph overlay.
road_layer = "freight_access"

# Connectivity products to generate.
methods = [
    #"weak",
    "strong",
]

# Save diagnostic PNG outputs.
plot_outputs = true


# -----------------------------------------------------------------------------
# Schema build selection
# -----------------------------------------------------------------------------

[schema]

# Road connectivity method used for truck links in the encoded schema.
road_connection_method = "strong"

# When true, build_schema.py prompts for one generated basemap variant.
interactive_basemap_selection = true


# Points within this distance outside the study-area boundary remain eligible
# for nearest-region assignment. Buffering is performed in EPSG:3347.
boundary_buffer_km = 50

# Simplification applied only to the temporary geometry used to construct the
# outer buffer. The exact boundary is still used for inside-study-area tests.
boundary_simplify_tolerance_km = 5

# Maximum nearest-region assignment distance as a multiple of the selected
# grid resolution. A factor of 2 permits up to 150 km on a 75 km grid,
# 100 km on a 50 km grid, and 20 km on a 10 km grid.
max_snap_distance_factor = 2.0

# When interactive_basemap_selection is false, uncomment and set this:
# basemap_stem = "provinces_only_basemap_50km_centroid"


# -----------------------------------------------------------------------------
# Geological CO2 storage representation
# -----------------------------------------------------------------------------

[storage]

# CO2_INJECT eligibility:
#   "all_mapped"  -> storage_accessible
#   "quantitative" -> has_quantitative_storage_evidence
#   "qualitative"  -> has_qualitative_storage_evidence
eligibility = "all_mapped"

# Numerical regional capacity bounds are not yet available in the Silver product.
use_capacity_bound = false


# -----------------------------------------------------------------------------
# Gasoline-demand spatial proxies
# -----------------------------------------------------------------------------

[gasoline_demand]

# Keep the source year explicit so a rolling StatCan update cannot silently
# alter a reproducible Silver build.
sales_year = 2024
gasoline_density_t_per_litre = 0.00074

[gasoline_demand.proxies]

# "population_threshold" selects every qualifying population centre.
# "supply_anchors_plus_fill" starts from the controlled anchor registry and
# adds centres that most reduce population-weighted DA-to-hub distance.
strategy = "population_threshold"

# The current Bronze boundary supports the official 1,000, 30,000, and 100,000
# population-centre class thresholds.
minimum_population = 100000
candidate_minimum_population = 30000
empty_jurisdiction_policy = "largest_population_centre"
anchor_registry = "registry/gasoline_supply_anchors.csv"

# Hybrid example: set strategy above to "supply_anchors_plus_fill", then add
# jurisdiction-specific fill counts such as ON = 5. All 13 codes are supported.
[gasoline_demand.proxies.additional_hubs]
# Counts are additions beyond registered anchors or the jurisdiction fallback.
# Uncomment only jurisdictions that should receive additional proxies.
# NL = 0
# PE = 0
# NS = 1
# NB = 2
# QC = 4
# ON = 5
# MB = 1
# SK = 1
# AB = 4
# BC = 5
# YT = 0
# NT = 0
# NU = 0


# -----------------------------------------------------------------------------
# Pipeline-routing impedance
# -----------------------------------------------------------------------------

[pipeline_impedance]

# Master switch for all spatial pipeline penalties in this build.
enabled = true
# Named assumptions are versioned separately from source metadata so sensitivity
# cases can change weights without changing the Silver source lineage.
penalty_registry = "registry/pipeline_impedance_penalties.yaml"
penalty_profile = "legacy_reference_v1"
output_crs = "EPSG:3347"


# -----------------------------------------------------------------------------
# Hydrography evidence
# -----------------------------------------------------------------------------

[hydrography]

# Canonical source ID from registry/geospatial_sources.yaml.
source_id = "nrcan_nhn_hhyd_national_en"
enabled = true
output_crs = "EPSG:3347"
permanency = ["unknown", "permanent", "intermittent"]


[hydrography.polygons]

enabled = true
# Supported NHN classes include lake, reservoir, pond, watercourse, and
# tidal_river. Polygon and line families are configured independently.
classes = ["lake"]

# Thresholds apply to complete source geometries before study-area clipping.
[hydrography.polygons.minimum_source_area_km2]
lake = 50.0


[hydrography.lines]

enabled = false
# Example for a later network build: ["watercourse", "tidal_river"]
classes = []

[hydrography.lines.minimum_source_length_km]
